[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgv-kilauea-validation"
version = "0.1.0"
description = "Reproducible Phase Gradient Voting and GNSS validation for Kilauea SAR interferograms"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Yasuhito Nagase"}]
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "scipy>=1.11", "rasterio>=1.3", "matplotlib>=3.8", "PyYAML>=6"]

[project.scripts]
pgv-kilauea = "pgv_kilauea_validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
